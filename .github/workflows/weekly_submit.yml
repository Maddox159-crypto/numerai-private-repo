name: Weekly Numerai Submission

on:
  schedule:
    # 화~토, 라운드 창(12:16~13:25 UTC) 전체에 걸쳐 4번 분산 트리거
    # + 각 job 내부에서도 최대 18분 자체 재시도 (infer_and_submit.py 참고)
    - cron: '5 12 * * 2-6'
    - cron: '35 12 * * 2-6'
    - cron: '5 13 * * 2-6'
    - cron: '20 13 * * 2-6'
  workflow_dispatch:

# 20260925 추가: 앞 job이 아직 재시도 중일 때 다음 트리거가 겹쳐 돌지 않도록 한 줄로 세움
#   (겹치면 둘 다 제출하고 둘 다 push -> 두 번째 push가 충돌로 실패해서 빨간 X가 뜰 수 있음)
concurrency:
  group: numerai-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 히스토리 파일 커밋을 위해 필요

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run inference and submit
        env:
          NUMERAI_PUBLIC_ID: ${{ secrets.NUMERAI_PUBLIC_ID }}
          NUMERAI_SECRET_KEY: ${{ secrets.NUMERAI_SECRET_KEY }}
        run: python infer_and_submit.py

      - name: Commit updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add era_pca_mean_history.json last_submitted_round.json
          git diff --staged --quiet || git commit -m "Update era pca mean history [skip ci]"
          # 20260925 추가: job 도는 사이 레포에 다른 커밋(모델 파일 업로드 등)이 들어와도 push 실패 안 하도록
          git pull --rebase
          git push

      - name: Notify on failure (Slack, optional)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"⚠️ Numerai 제출 실패: $(date -u +%Y-%m-%dT%H:%M:%SZ) - repo: ${{ github.repository }}, run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL secret이 없어서 Slack 알림은 건너뜀 (GitHub 기본 이메일 알림은 자동으로 감)"
          fi
